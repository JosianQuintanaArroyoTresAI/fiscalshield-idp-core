      - name: outputTokens
      - name: cacheReadInputTokens
      - name: cacheWriteInputTokens
  - name: bedrock/eu.amazon.nova-pro-v1:0
    dimensions:
      - name: inputTokens
      - name: outputTokens
      - name: cacheReadInputTokens
      - name: cacheWriteInputTokens
  - name: bedrock/eu.anthropic.claude-3-haiku-20240307-v1:0
    dimensions:
      - name: inputTokens
      - name: outputTokens
      - name: cacheReadInputTokens
      - name: cacheWriteInputTokens
  - name: bedrock/eu.anthropic.claude-3-5-sonnet-20240620-v1:0
    dimensions:
      - name: inputTokens
      - name: outputTokens
      - name: cacheReadInputTokens
      - name: cacheWriteInputTokens
  - name: bedrock/eu.anthropic.claude-3-7-sonnet-20250219-v1:0
    dimensions:
      - name: inputTokens
      - name: outputTokens
      - name: cacheReadInputTokens
      - name: cacheWriteInputTokens
