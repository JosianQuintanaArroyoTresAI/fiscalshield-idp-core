AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  IDP Evaluation Stack - Automated model performance evaluation pipeline
  using batch inference and weighted sampling by confidence scores

Parameters:
  StackName:
    Type: String
    Description: Name of the main IDP stack to connect to
    Default: fiscalshield-idp-dev

  ExtractionResultsKmsKeyArn:
    Type: String
    Description: KMS key ARN used to encrypt the main stack's ExtractionResults table
    AllowedPattern: "^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9A-Fa-f-]+$"
  
  EvaluationRegion:
    Type: String
    Description: AWS region for evaluation models (use us-east-1 for best models)
    Default: us-east-1
    AllowedValues:
      - us-east-1
      - eu-central-1
      - us-west-2
  
  SamplingRate:
    Type: Number
    Description: Base sampling rate (percentage of total documents to evaluate)
    Default: 10
    MinValue: 1
    MaxValue: 100
  
  LowConfidenceThreshold:
    Type: Number
    Description: Confidence threshold below which ALL documents are evaluated
    Default: 0.7
    MinValue: 0.0
    MaxValue: 1.0
  
  MediumConfidenceSamplingRate:
    Type: Number
    Description: Sampling rate for medium confidence documents (0.7-0.9)
    Default: 20
    MinValue: 0
    MaxValue: 100
  
  HighConfidenceSamplingRate:
    Type: Number
    Description: Sampling rate for high confidence documents (>0.9)
    Default: 5
    MinValue: 0
    MaxValue: 100
  
  EvaluationSchedule:
    Type: String
    Description: EventBridge schedule expression for evaluation runs
    Default: "cron(0 2 * * ? *)"  # 2 AM daily
  
  BatchInferenceEnabled:
    Type: String
    Description: Use Bedrock batch inference (50% discount, 6-24hr latency)
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  
  EvaluationModelId:
    Type: String
    Description: Model ID for evaluation baseline (use best model in EvaluationRegion)
    Default: "us.anthropic.claude-sonnet-4-20250514-v1:0"
  
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR

Mappings:
  # Map regions to best available models
  RegionModelMap:
    us-east-1:
      BestOCR: "us.anthropic.claude-sonnet-4-20250514-v1:0"
      BestExtraction: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      BatchSupported: "us.anthropic.claude-3-5-sonnet-20240620-v1:0"
    eu-central-1:
      BestOCR: "eu.anthropic.claude-3-7-sonnet-20250219-v1:0"
      BestExtraction: "eu.anthropic.claude-3-7-sonnet-20250219-v1:0"
      BatchSupported: "eu.anthropic.claude-3-5-sonnet-20240620-v1:0"

Conditions:
  UseBatchInference: !Equals [!Ref BatchInferenceEnabled, "true"]

Resources:
  # =========================================================================
  # DYNAMODB TABLES
  # =========================================================================
  
  EvaluationMetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${StackName}-EvaluationMetrics"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: EvaluationDate
          AttributeType: N
      
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      
      GlobalSecondaryIndexes:
        # Query by evaluation run date
        - IndexName: GSI1-ByEvaluationDate
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: EvaluationDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # Query by model comparison
        - IndexName: GSI2-ByModel
          KeySchema:
            - AttributeName: GSI1SK
              KeyType: HASH
            - AttributeName: EvaluationDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      
      Tags:
        - Key: Purpose
          Value: ModelEvaluation
        - Key: Stack
          Value: !Ref StackName

  # Table for tracking batch inference jobs
  BatchJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${StackName}-EvaluationBatchJobs"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      
      AttributeDefinitions:
        - AttributeName: JobId
          AttributeType: S
        - AttributeName: Status
          AttributeType: S
        - AttributeName: CreatedAt
          AttributeType: N
      
      KeySchema:
        - AttributeName: JobId
          KeyType: HASH
      
      GlobalSecondaryIndexes:
        - IndexName: GSI1-ByStatus
          KeySchema:
            - AttributeName: Status
              KeyType: HASH
            - AttributeName: CreatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # =========================================================================
  # S3 BUCKETS
  # =========================================================================
  
  EvaluationDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StackName}-evaluation-data-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Delete batch input files after 30 days
          - Id: DeleteOldBatchInputs
            Status: Enabled
            Prefix: batch-inputs/
            ExpirationInDays: 30
          
          # Keep evaluation results for 90 days
          - Id: DeleteOldResults
            Status: Enabled
            Prefix: evaluation-results/
            ExpirationInDays: 90
          
          # Transition to IA after 30 days
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA

  # =========================================================================
  # IAM ROLES
  # =========================================================================
  
  EvaluationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackName}-EvaluationLambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EvaluationAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # List DynamoDB tables for discovery
              - Effect: Allow
                Action:
                  - dynamodb:ListTables
                Resource: "*"
              
              # Read from production ExtractionResultsTable
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackName}-ExtractionResultsTable*"
              
              # Read from production TrackingTable (for original document location)
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackName}-TrackingTable*"
              
              # Write to evaluation tables
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt EvaluationMetricsTable.Arn
                  - !Sub "${EvaluationMetricsTable.Arn}/index/*"
                  - !GetAtt BatchJobsTable.Arn
                  - !Sub "${BatchJobsTable.Arn}/index/*"
              
              # S3 access for original documents and results
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${StackName}-*/*"
                  - !GetAtt EvaluationDataBucket.Arn
                  - !Sub "${EvaluationDataBucket.Arn}/*"
              
              # Bedrock access for evaluation models
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:aws:bedrock:${EvaluationRegion}::foundation-model/*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
              
              # Bedrock batch inference
              - Effect: Allow
                Action:
                  - bedrock:CreateModelInvocationJob
                  - bedrock:GetModelInvocationJob
                  - bedrock:ListModelInvocationJobs
                  - bedrock:StopModelInvocationJob
                Resource: "*"
              
              # SSM for discovering table names
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${StackName}/*"

              # Decrypt ExtractionResults data encrypted with CMK
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource:
                  - !Ref ExtractionResultsKmsKeyArn

  BedrockBatchRole:
    Type: AWS::IAM::Role
    Condition: UseBatchInference
    Properties:
      RoleName: !Sub "${StackName}-BedrockBatchRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BatchInferenceAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt EvaluationDataBucket.Arn
                  - !Sub "${EvaluationDataBucket.Arn}/*"

  # =========================================================================
  # LAMBDA FUNCTIONS
  # =========================================================================
  
  SamplerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StackName}-EvaluationSampler"
      CodeUri: src/sampler/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt EvaluationLambdaRole.Arn
      Environment:
        Variables:
          STACK_NAME: !Ref StackName
          EXTRACTION_RESULTS_TABLE: !Sub "${StackName}-ExtractionResultsTable"
          EVALUATION_METRICS_TABLE: !Ref EvaluationMetricsTable
          BATCH_JOBS_TABLE: !Ref BatchJobsTable
          EVALUATION_BUCKET: !Ref EvaluationDataBucket
          LOW_CONFIDENCE_THRESHOLD: !Ref LowConfidenceThreshold
          MEDIUM_SAMPLING_RATE: !Ref MediumConfidenceSamplingRate
          HIGH_SAMPLING_RATE: !Ref HighConfidenceSamplingRate
          BATCH_INFERENCE_ENABLED: !Ref BatchInferenceEnabled
          LOG_LEVEL: !Ref LogLevel

  ComparatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StackName}-EvaluationComparator"
      CodeUri: src/comparator/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt EvaluationLambdaRole.Arn
      Environment:
        Variables:
          STACK_NAME: !Ref StackName
          EVALUATION_METRICS_TABLE: !Ref EvaluationMetricsTable
          EVALUATION_BUCKET: !Ref EvaluationDataBucket
          LOG_LEVEL: !Ref LogLevel

  BatchJobMonitorFunction:
    Type: AWS::Serverless::Function
    Condition: UseBatchInference
    Properties:
      FunctionName: !Sub "${StackName}-BatchJobMonitor"
      CodeUri: src/batch_monitor/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt EvaluationLambdaRole.Arn
      Environment:
        Variables:
          BATCH_JOBS_TABLE: !Ref BatchJobsTable
          EVALUATION_REGION: !Ref EvaluationRegion
          LOG_LEVEL: !Ref LogLevel

  ReEvaluationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StackName}-ReEvaluation"
      CodeUri: src/reevaluator/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 2048
      Role: !GetAtt EvaluationLambdaRole.Arn
      Environment:
        Variables:
          STACK_NAME: !Ref StackName
          EVALUATION_MODEL_ID: !Ref EvaluationModelId
          EVALUATION_REGION: !Ref EvaluationRegion
          EVALUATION_BUCKET: !Ref EvaluationDataBucket
          BATCH_INFERENCE_ENABLED: !Ref BatchInferenceEnabled
          BEDROCK_BATCH_ROLE_ARN: !If [UseBatchInference, !GetAtt BedrockBatchRole.Arn, ""]
          BATCH_JOBS_TABLE: !Ref BatchJobsTable
          LOG_LEVEL: !Ref LogLevel

  # =========================================================================
  # STEP FUNCTIONS STATE MACHINE
  # =========================================================================
  
  EvaluationStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StateMachineExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt SamplerFunction.Arn
                  - !GetAtt ReEvaluationFunction.Arn
                  - !GetAtt ComparatorFunction.Arn
                  - !If
                    - UseBatchInference
                    - !GetAtt BatchJobMonitorFunction.Arn
                    - !Ref AWS::NoValue

  EvaluationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${StackName}-EvaluationPipeline"
      Role: !GetAtt EvaluationStateMachineRole.Arn
      DefinitionUri: statemachine/evaluation_pipeline.asl.json
      DefinitionSubstitutions:
        SamplerFunctionArn: !GetAtt SamplerFunction.Arn
        ReEvaluationFunctionArn: !GetAtt ReEvaluationFunction.Arn
        ComparatorFunctionArn: !GetAtt ComparatorFunction.Arn
        BatchJobMonitorFunctionArn: !If
          - UseBatchInference
          - !GetAtt BatchJobMonitorFunction.Arn
          - ""
        UseBatchInference: !Ref BatchInferenceEnabled

  # =========================================================================
  # EVENTBRIDGE SCHEDULER
  # =========================================================================
  
  EvaluationSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachine
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !GetAtt EvaluationStateMachine.Arn

  EvaluationScheduleResource:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${StackName}-EvaluationSchedule"
      Description: Automated evaluation pipeline execution
      ScheduleExpression: !Ref EvaluationSchedule
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt EvaluationStateMachine.Arn
        RoleArn: !GetAtt EvaluationSchedulerRole.Arn
        Input: |
          {
            "evaluationType": "scheduled",
            "lookbackDays": 1
          }

  # =========================================================================
  # SSM PARAMETERS FOR CROSS-STACK DISCOVERY
  # =========================================================================
  
  EvaluationMetricsTableParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${StackName}/evaluation/metrics-table-name"
      Type: String
      Value: !Ref EvaluationMetricsTable
      Description: Name of the evaluation metrics DynamoDB table

  EvaluationBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${StackName}/evaluation/bucket-name"
      Type: String
      Value: !Ref EvaluationDataBucket
      Description: Name of the evaluation data S3 bucket

Outputs:
  EvaluationMetricsTableName:
    Description: DynamoDB table for evaluation metrics
    Value: !Ref EvaluationMetricsTable
    Export:
      Name: !Sub "${StackName}-EvaluationMetricsTable"
  
  EvaluationMetricsTableArn:
    Description: ARN of evaluation metrics table
    Value: !GetAtt EvaluationMetricsTable.Arn
    Export:
      Name: !Sub "${StackName}-EvaluationMetricsTableArn"
  
  EvaluationDataBucketName:
    Description: S3 bucket for evaluation data
    Value: !Ref EvaluationDataBucket
    Export:
      Name: !Sub "${StackName}-EvaluationBucket"
  
  EvaluationStateMachineArn:
    Description: ARN of evaluation Step Functions state machine
    Value: !GetAtt EvaluationStateMachine.Arn
    Export:
      Name: !Sub "${StackName}-EvaluationStateMachine"
  
  SamplerFunctionArn:
    Description: ARN of sampler Lambda function
    Value: !GetAtt SamplerFunction.Arn
  
  ComparatorFunctionArn:
    Description: ARN of comparator Lambda function
    Value: !GetAtt ComparatorFunction.Arn
