  TriggerResearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'fiscalshield-dc-${Environment}-TriggerResearch'
      Description: Trigger Step Functions workflow for company background research
      InlineCode: |
        import json
        import os
        import boto3
        from datetime import datetime

        sfn_client = boto3.client('stepfunctions')
        STATE_MACHINE_ARN = os.environ['STATE_MACHINE_ARN']

        def lambda_handler(event, context):
            print(f"Event: {json.dumps(event)}")
            
            try:
                # Parse request body
                body = json.loads(event.get('body', '{}'))
                
                company_number = body.get('company_number')
                company_name = body.get('company_name')
                enable_aml = body.get('enable_aml', True)  # Default to True
                
                if not company_number:
                    return {
                        'statusCode': 400,
                        'headers': {
                            'Content-Type': 'application/json',
                            'Access-Control-Allow-Origin': '*',
                            'Access-Control-Allow-Headers': 'Content-Type',
                            'Access-Control-Allow-Methods': 'POST,OPTIONS'
                        },
                        'body': json.dumps({'error': 'company_number is required'})
                    }
                
                # Start Step Functions execution
                execution_name = f"ui-trigger-{company_number}-{int(datetime.now().timestamp())}"
                
                input_data = {
                    'company_number': company_number,
                    'company_name': company_name or f"Company {company_number}",
                    'enable_aml': enable_aml
                }
                
                response = sfn_client.start_execution(
                    stateMachineArn=STATE_MACHINE_ARN,
                    name=execution_name,
                    input=json.dumps(input_data)
                )
                
                return {
                    'statusCode': 200,
                    'headers': {
                        'Content-Type': 'application/json',
                        'Access-Control-Allow-Origin': '*',
                        'Access-Control-Allow-Headers': 'Content-Type',
                        'Access-Control-Allow-Methods': 'POST,OPTIONS'
                    },
                    'body': json.dumps({
                        'success': True,
                        'execution_arn': response['executionArn'],
                        'execution_name': execution_name,
                        'message': 'Background research initiated',
                        'estimated_completion_seconds': 45
                    })
                }
                
            except Exception as e:
                print(f"Error: {str(e)}")
                return {
                    'statusCode': 500,
                    'headers': {
                        'Content-Type': 'application/json',
                        'Access-Control-Allow-Origin': '*',
                        'Access-Control-Allow-Headers': 'Content-Type',
                        'Access-Control-Allow-Methods': 'POST,OPTIONS'
                    },
                    'body': json.dumps({'error': str(e)})
                }
      Handler: index.lambda_handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt TriggerResearchLambdaRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref CompanyResearchStateMachine
      Events:
        PostTriggerResearch:
          Type: Api
          Properties:
            RestApiId: !Ref DataCollectionApi
            Path: /research/company
            Method: POST

  TriggerResearchLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'fiscalshield-dc-${Environment}-TriggerResearchRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StartStepFunctionsExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref CompanyResearchStateMachine

  # ========================================================================
  # STEP FUNCTIONS STATE MACHINE
  # ========================================================================

  CompanyResearchStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'fiscalshield-dc-${Environment}-CompanyResearch'
      Type: STANDARD
      DefinitionUri: state-machines/company-research.asl.json
      DefinitionSubstitutions:
        CompanyLookupFunctionArn: !GetAtt CompanyLookupFunction.Arn
        OfficersFunctionArn: !GetAtt OfficersFunction.Arn
        PSCFunctionArn: !GetAtt PSCFunction.Arn
        ChargesFunctionArn: !GetAtt ChargesFunction.Arn
        InsolvencyFunctionArn: !GetAtt InsolvencyFunction.Arn
        FilingHistoryFunctionArn: !GetAtt FilingHistoryFunction.Arn
        SanctionsCheckerFunctionArn: !GetAtt SanctionsCheckerFunction.Arn
        MediaCheckerFunctionArn: !GetAtt MediaCheckerFunction.Arn
      Role: !GetAtt StepFunctionsExecutionRole.Arn
      Logging:
        Level: !If [IsProduction, ERROR, ALL]
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
      Tracing:
        Enabled: !If [EnableTracing, true, false]
      Tags:
        Environment: !Ref Environment
        Purpose: Orchestrate company data collection from multiple sources

  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'fiscalshield-dc-${Environment}-StepFunctionsRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt CompanyLookupFunction.Arn
                  - !GetAtt OfficersFunction.Arn
                  - !GetAtt PSCFunction.Arn
                  - !GetAtt ChargesFunction.Arn
                  - !GetAtt InsolvencyFunction.Arn
                  - !GetAtt FilingHistoryFunction.Arn
                  - !GetAtt SanctionsCheckerFunction.Arn
                  - !GetAtt MediaCheckerFunction.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
        - PolicyName: XRayTracing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-StepFunctionsRole'
        - Key: Environment
          Value: !Ref Environment

  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/fiscalshield-dc-${Environment}-CompanyResearch'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If [IsProduction, !GetAtt LogsKMSKey.Arn, !Ref AWS::NoValue]

