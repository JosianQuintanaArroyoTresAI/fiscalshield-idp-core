AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FiscalShield Data Collection Stack
  
  Independent stack for fetching, caching, and managing external data sources
  (Companies House, HMRC, Banking APIs). Convention-based naming enables 
  cross-stack access without exports.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Environment Configuration"
        Parameters:
          - Environment
      - Label:
          default: "Cache Configuration"
        Parameters:
          - CacheTTLHours
          - CompaniesHouseRateLimit
          - CompaniesHouseRateWindow
      - Label:
          default: "Monitoring Configuration"
        Parameters:
          - EnableXRayTracing
          - LogRetentionDays

Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev, staging, prod)
    AllowedValues:
      - dev
      - staging
      - prod
    Default: dev

  CacheTTLHours:
    Type: Number
    Description: Default cache TTL in hours
    Default: 24
    MinValue: 1
    MaxValue: 168

  CompaniesHouseRateLimit:
    Type: Number
    Description: Companies House API rate limit (requests per window)
    Default: 600

  CompaniesHouseRateWindow:
    Type: Number
    Description: Rate limit window in seconds
    Default: 300

  EnableXRayTracing:
    Type: String
    Description: Enable AWS X-Ray tracing for Lambda functions
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'

  LogRetentionDays:
    Type: Number
    Description: CloudWatch Logs retention period in days
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Default: 7

Conditions:
  IsProduction: !Equals [!Ref Environment, 'prod']
  EnableTracing: !Equals [!Ref EnableXRayTracing, 'true']

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Tracing: !If [EnableTracing, Active, PassThrough]
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        CACHE_TTL_HOURS: !Ref CacheTTLHours
        LOG_LEVEL: !If [IsProduction, 'INFO', 'DEBUG']
    Tags:
      Environment: !Ref Environment
      Stack: fiscalshield-dc
      ManagedBy: CloudFormation

Resources:
  # ========================================================================
  # DYNAMODB TABLES
  # ========================================================================

  FilingEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'fiscalshield-dc-${Environment}-FilingEvents'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: company_number
          AttributeType: S
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: last_updated
          AttributeType: N
      KeySchema:
        - AttributeName: company_number
          KeyType: HASH
        - AttributeName: client_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: client-index
          KeySchema:
            - AttributeName: client_id
              KeyType: HASH
            - AttributeName: last_updated
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-FilingEvents'
        - Key: Purpose
          Value: Cache Companies House filing history data
        - Key: DataRetention
          Value: !Sub '${CacheTTLHours} hours'

  CompanyEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'fiscalshield-dc-${Environment}-CompanyEvents'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: company_number
          AttributeType: S
        - AttributeName: event_type_timestamp
          AttributeType: S
        - AttributeName: client_id
          AttributeType: S
      KeySchema:
        - AttributeName: company_number
          KeyType: HASH
        - AttributeName: event_type_timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: client-event-index
          KeySchema:
            - AttributeName: client_id
              KeyType: HASH
            - AttributeName: event_type_timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-CompanyEvents'
        - Key: Purpose
          Value: Cache company information and officer data
        - Key: DataRetention
          Value: !Sub '${CacheTTLHours} hours'

  HMRCDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'fiscalshield-dc-${Environment}-HMRCData'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: vat_number
          AttributeType: S
        - AttributeName: period_key
          AttributeType: S
        - AttributeName: client_id
          AttributeType: S
      KeySchema:
        - AttributeName: vat_number
          KeyType: HASH
        - AttributeName: period_key
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: client-period-index
          KeySchema:
            - AttributeName: client_id
              KeyType: HASH
            - AttributeName: period_key
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-HMRCData'
        - Key: Purpose
          Value: Cache HMRC VAT returns and tax data
        - Key: DataRetention
          Value: 7 days
        - Key: Status
          Value: Future implementation

  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'fiscalshield-dc-${Environment}-RateLimits'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: api_name
          AttributeType: S
      KeySchema:
        - AttributeName: api_name
          KeyType: HASH
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-RateLimits'
        - Key: Purpose
          Value: Track API rate limits for external services
        - Key: DataRetention
          Value: Auto-expire with TTL

  AdverseMediaArticlesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'fiscalshield-dc-${Environment}-AdverseMediaArticles'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true  # Always enabled for compliance
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: company_number
          AttributeType: S
        - AttributeName: article_id
          AttributeType: S
        - AttributeName: scan_date
          AttributeType: S
        - AttributeName: risk_score
          AttributeType: N
      KeySchema:
        - AttributeName: company_number
          KeyType: HASH
        - AttributeName: article_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: scan-date-index
          KeySchema:
            - AttributeName: company_number
              KeyType: HASH
            - AttributeName: scan_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: risk-score-index
          KeySchema:
            - AttributeName: company_number
              KeyType: HASH
            - AttributeName: risk_score
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-AdverseMediaArticles'
        - Key: Purpose
          Value: Store individual adverse media articles with AI risk analysis
        - Key: DataRetention
          Value: 7 years for compliance
        - Key: GDPRCompliant
          Value: 'true'
        - Key: ComplianceType
          Value: AML-Screening

  HMRCGuidanceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'fiscalshield-dc-${Environment}-HMRCGuidance'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: false  # Guidance doesn't expire, updated via weekly refresh
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: section_id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: last_updated
          AttributeType: N
      KeySchema:
        - AttributeName: section_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: last_updated
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-HMRCGuidance'
        - Key: Purpose
          Value: Store HMRC BIM compliance rules from GOV.UK API
        - Key: DataSource
          Value: GOV-UK-Content-API
        - Key: UpdateFrequency
          Value: Weekly

  # ========================================================================
  # S3 STORAGE
  # ========================================================================

  DataArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'fiscalshield-dc-${Environment}-data-archive-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-data-archive'
        - Key: Purpose
          Value: Large-API-Response-Archive
        - Key: DataRetention
          Value: Lifecycle-Managed

  # ========================================================================
  # SECRETS MANAGER
  # ========================================================================

  CompaniesHouseApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'fiscalshield-dc-${Environment}-CompaniesHouseAPI'
      Description: Companies House API credentials and configuration
      SecretString: !Sub |
        {
          "api_key": "PLACEHOLDER_REPLACE_WITH_ACTUAL_KEY",
          "base_url": "https://api.company-information.service.gov.uk",
          "rate_limit": ${CompaniesHouseRateLimit},
          "rate_limit_window": ${CompaniesHouseRateWindow}
        }
      KmsKeyId: alias/aws/secretsmanager
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-CompaniesHouseAPI'
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Companies House API authentication

  HMRCApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'fiscalshield-dc-${Environment}-HMRCAPI'
      Description: HMRC API OAuth credentials (future implementation)
      SecretString: |
        {
          "client_id": "PLACEHOLDER",
          "client_secret": "PLACEHOLDER",
          "access_token": "",
          "refresh_token": "",
          "token_expiry": "",
          "base_url": "https://api.service.hmrc.gov.uk"
        }
      KmsKeyId: alias/aws/secretsmanager
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-HMRCAPI'
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: HMRC API OAuth authentication
        - Key: Status
          Value: Future implementation

  BankingApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'fiscalshield-dc-${Environment}-BankingAPI'
      Description: Banking API credentials (future implementation)
      SecretString: |
        {
          "client_id": "PLACEHOLDER",
          "client_secret": "PLACEHOLDER",
          "base_url": ""
        }
      KmsKeyId: alias/aws/secretsmanager
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-BankingAPI'
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Banking API authentication
        - Key: Status
          Value: Future implementation

  OpenSanctionsApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'fiscalshield-dc-${Environment}-OpenSanctionsAPI'
      Description: OpenSanctions API key for sanctions and PEP screening
      SecretString: |
        {
          "api_key": "PLACEHOLDER_COPY_FROM_EU_WEST_2",
          "base_url": "https://api.opensanctions.org",
          "rate_limit": 100,
          "rate_limit_window": 60
        }
      KmsKeyId: alias/aws/secretsmanager
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-OpenSanctionsAPI'
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: AML sanctions and PEP screening
        - Key: Status
          Value: Update with real API key after deployment

  NewsApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'fiscalshield-dc-${Environment}-NewsAPI'
      Description: NewsAPI key for adverse media screening
      SecretString: |
        {
          "api_key": "PLACEHOLDER_COPY_FROM_EU_WEST_2",
          "base_url": "https://newsapi.org/v2",
          "rate_limit": 100,
          "rate_limit_window": 86400
        }
      KmsKeyId: alias/aws/secretsmanager
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-NewsAPI'
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: AML adverse media screening
        - Key: Status
          Value: Update with real API key after deployment

  # ========================================================================
  # IAM ROLES
  # ========================================================================

  DataCollectionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'fiscalshield-dc-${Environment}-LambdaExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !If 
          - EnableTracing
          - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
          - !Ref AWS::NoValue
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDBTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt FilingEventsTable.Arn
                  - !GetAtt CompanyEventsTable.Arn
                  - !GetAtt HMRCDataTable.Arn
                  - !GetAtt RateLimitsTable.Arn
                  - !GetAtt HMRCGuidanceTable.Arn
                  - !GetAtt AdverseMediaArticlesTable.Arn
                  - !Sub '${FilingEventsTable.Arn}/index/*'
                  - !Sub '${CompanyEventsTable.Arn}/index/*'
                  - !Sub '${HMRCDataTable.Arn}/index/*'
                  - !Sub '${HMRCGuidanceTable.Arn}/index/*'
                  - !Sub '${AdverseMediaArticlesTable.Arn}/index/*'
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetSecretValues
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref CompaniesHouseApiSecret
                  - !Ref HMRCApiSecret
                  - !Ref BankingApiSecret
                  - !Ref OpenSanctionsApiSecret
                  - !Ref NewsApiSecret
              - Sid: CrossRegionSecretsAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:eu-west-2:${AWS::AccountId}:secret:taxguard/opensanctions/*'
                  - !Sub 'arn:aws:secretsmanager:eu-west-2:${AWS::AccountId}:secret:taxguard/newsapi/*'
        - PolicyName: S3DataArchiveAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3BucketAccess
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::fiscalshield-dc-${Environment}-data-archive-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::fiscalshield-dc-${Environment}-data-archive-${AWS::AccountId}/*'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeNovaMicro
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0'
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PutMetricData
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: FiscalShield/DataCollection
        - PolicyName: StepFunctionsReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DescribeStateMachine
                Effect: Allow
                Action:
                  - states:DescribeStateMachine
                Resource:
                  - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:fiscalshield-dc-${Environment}-CompanyResearch'
      Tags:
        - Key: Name
          Value: !Sub 'fiscalshield-dc-${Environment}-LambdaExecutionRole'
        - Key: Environment
          Value: !Ref Environment

  # ========================================================================
  # CLOUDWATCH LOG GROUPS
  # ========================================================================

  DataCollectionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/fiscalshield-dc-${Environment}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If [IsProduction, !GetAtt LogsKMSKey.Arn, !Ref AWS::NoValue]

  LogsKMSKey:
    Type: AWS::KMS::Key
    Condition: IsProduction
    Properties:
      Description: !Sub 'KMS key for CloudWatch Logs encryption - ${Environment}'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow CloudWatch Logs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn':
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/fiscalshield-dc-${Environment}*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/fiscalshield-dc-${Environment}*'

  LogsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Condition: IsProduction
    Properties:
      AliasName: !Sub 'alias/fiscalshield-dc-${Environment}-logs'
      TargetKeyId: !Ref LogsKMSKey

  # ========================================================================
  # CLOUDWATCH ALARMS
  # ========================================================================

  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'fiscalshield-dc-${Environment}-HighErrorRate'
      AlarmDescription: Alert when error rate exceeds threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Sub 'fiscalshield-dc-${Environment}'
      TreatMissingData: notBreaching

  # ========================================================================
  # LAMBDA FUNCTIONS
  # ========================================================================

  CompanyLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'fiscalshield-dc-${Environment}-CompanyLookup'
      Description: Lookup Companies House company profile with caching
      CodeUri: ../../src/data_collection/companies_house/company_lookup/
      Handler: handler.lambda_handler
      Role: !GetAtt DataCollectionLambdaRole.Arn
      Environment:
        Variables:
          CACHE_TABLE_NAME: !Ref CompanyEventsTable
          SECRET_NAME: !Ref CompaniesHouseApiSecret
          RATE_LIMIT_TABLE: !Ref RateLimitsTable
      Events:
        GetCompany:
          Type: Api
          Properties:
            RestApiId: !Ref DataCollectionApi
            Path: /company/{company_number}
            Method: GET

  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'fiscalshield-dc-${Environment}-HealthCheck'
      Description: Health check endpoint for Core Stack integration
      CodeUri: ../../src/data_collection/health/
      Handler: handler.lambda_handler
      Role: !GetAtt DataCollectionLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          SECRET_NAME: !Ref CompaniesHouseApiSecret
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref DataCollectionApi
            Path: /health
            Method: GET

  OfficersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'fiscalshield-dc-${Environment}-Officers'
      Description: Fetch Companies House officers data with caching
      CodeUri: ../../src/data_collection/companies_house/officers/
      Handler: handler.lambda_handler
      Role: !GetAtt DataCollectionLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          CACHE_TABLE_NAME: !Ref CompanyEventsTable
          SECRET_NAME: !Ref CompaniesHouseApiSecret
          RATE_LIMIT_TABLE: !Ref RateLimitsTable
      Events:
        GetOfficers:
          Type: Api
          Properties:
            RestApiId: !Ref DataCollectionApi
            Path: /officers/{company_number}
            Method: GET

  FilingHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'fiscalshield-dc-${Environment}-FilingHistory'
      Description: Fetch Companies House filing history with caching
      CodeUri: ../../src/data_collection/companies_house/filing_history/
      Handler: handler.lambda_handler
      Role: !GetAtt DataCollectionLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          CACHE_TABLE_NAME: !Ref CompanyEventsTable
          SECRET_NAME: !Ref CompaniesHouseApiSecret
          RATE_LIMIT_TABLE: !Ref RateLimitsTable
          DATA_ARCHIVE_BUCKET: !Sub 'fiscalshield-dc-${Environment}-data-archive-${AWS::AccountId}'
      Events:
        GetFilingHistory:
          Type: Api
          Properties:
            RestApiId: !Ref DataCollectionApi
            Path: /filing-history/{company_number}
            Method: GET

  PSCFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'fiscalshield-dc-${Environment}-PSCLookup'
      Description: Fetch Companies House PSC data with caching
      CodeUri: ../../src/data_collection/companies_house/psc_lookup/
      Handler: handler.lambda_handler
      Role: !GetAtt DataCollectionLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          CACHE_TABLE_NAME: !Ref CompanyEventsTable
          SECRET_NAME: !Ref CompaniesHouseApiSecret
          RATE_LIMIT_TABLE: !Ref RateLimitsTable
      Events:
        GetPSC:
          Type: Api
          Properties:
            RestApiId: !Ref DataCollectionApi
            Path: /psc/{company_number}
            Method: GET

