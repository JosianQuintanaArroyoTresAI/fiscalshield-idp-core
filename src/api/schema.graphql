# GraphQL Schema for FiscalShield IDP Core
interface DynamoDbBase {
	PK: ID!
	SK: ID!
	ExpiresAfter: AWSTimestamp
}

type Document implements DynamoDbBase @aws_cognito_user_pools @aws_iam {
  PK: ID!
  SK: ID!
  ObjectKey: ID
  ObjectStatus: String
  InitialEventTime: AWSDateTime
  QueuedTime: AWSDateTime
  WorkflowStartTime: AWSDateTime
  CompletionTime: AWSDateTime
  WorkflowExecutionArn: String
  WorkflowStatus: String
  PageCount: Int
  Sections: [Section]
  Pages: [Page]
  Metering: AWSJSON
  EvaluationReportUri: String
  EvaluationStatus: String
  SummaryReportUri: String
  ExpiresAfter: AWSTimestamp
  HITLStatus: String
  HITLReviewURL: String
}

type Section @aws_cognito_user_pools @aws_iam {
  Id: String
  PageIds: [ Int ]
  Class: String
  OutputJSONUri: String
  ConfidenceThresholdAlerts: [ConfidenceThresholdAlert]
}

type ConfidenceThresholdAlert @aws_cognito_user_pools @aws_iam {
  attributeName: String
  confidence: Float
  confidenceThreshold: Float
}

type Page @aws_cognito_user_pools @aws_iam {
  Id: Int
  Class: String
  ImageUri: String
  TextUri: String
  TextConfidenceUri: String
}

type DocumentList @aws_cognito_user_pools @aws_iam {
	Documents: [DocumentListItem]
	nextToken: String
}

type DocumentListItem implements DynamoDbBase @aws_cognito_user_pools @aws_iam {
	PK: ID!
	SK: ID!
    ObjectKey: ID
    InitialEventTime: AWSDateTime
    ExpiresAfter: AWSTimestamp
    HITLStatus: String
    HITLReviewURL: String
}

type ConfigurationResponse @aws_cognito_user_pools @aws_iam {
  Schema: AWSJSON
  Default: AWSJSON
  Custom: AWSJSON
}

type DiscoveryJobList @aws_cognito_user_pools @aws_iam {
  DiscoveryJobs: [DiscoveryJobListItem]
  nextToken: String
}

type DiscoveryJobListItem @aws_cognito_user_pools @aws_iam {
  jobId: ID!
  documentKey: String
  groundTruthKey: String
  status: String!
  createdAt: String
  updatedAt: String
  errorMessage: String

}

input CreateDocumentInput {
  ObjectKey: ID
  ObjectStatus: String
  InitialEventTime: AWSDateTime
  QueuedTime: AWSDateTime
  ExpiresAfter: AWSTimestamp
  UserId: String
  CompanyNumber: String
}

type CreateDocumentOutput @aws_iam {
  ObjectKey: ID
}

type PresignedUrlResponse @aws_cognito_user_pools {
  presignedUrl: String!
  objectKey: String!
  usePostMethod: String!
}
type DisPresignedUrlResponse @aws_cognito_user_pools {
  presignedUrl: String!
  objectKey: String!
  usePostMethod: String!
  groundTruthObjectKey: String
  groundTruthPresignedUrl: String
}

input UpdateDocumentInput {
  ObjectKey: ID!
  UserId: String
  ObjectStatus: String
  QueuedTime: AWSDateTime
  WorkflowStartTime: AWSDateTime
  CompletionTime: AWSDateTime
  WorkflowExecutionArn: String
  WorkflowStatus: String
  PageCount: Int
  Sections: [SectionInput]
  Pages: [PageInput]
  Metering: AWSJSON
  EvaluationReportUri: String
  EvaluationStatus: String
  SummaryReportUri: String
  HITLStatus: String
  HITLReviewURL: String
}

input SectionInput {
  Id: String
  PageIds: [ Int ]
  Class: String
  OutputJSONUri: String
  ConfidenceThresholdAlerts: [ConfidenceThresholdAlertInput]
}

input ConfidenceThresholdAlertInput {
  attributeName: String
  confidence: Float
  confidenceThreshold: Float
}

input PageInput {
  Id: Int
  Class: String
  ImageUri: String
  TextUri: String
  TextConfidenceUri: String
}

type CopyToBaselineResponse @aws_cognito_user_pools {
  success: Boolean!
  message: String
}

type ProcessChangesResponse @aws_cognito_user_pools {
  success: Boolean!
  message: String
  processingJobId: String
}

input ModifiedSectionInput {
  sectionId: String!
  classification: String!
  pageIds: [Int!]!
  isNew: Boolean
  isDeleted: Boolean
}

type FileContentsResponse @aws_cognito_user_pools @aws_iam {
  content: String!
  contentType: String!
  size: Int!
  isBinary: Boolean
}

type StepFunctionExecutionStep @aws_cognito_user_pools @aws_iam {
  name: String!
  type: String!
  status: String!
  startDate: AWSDateTime
  stopDate: AWSDateTime
  input: AWSJSON
  output: AWSJSON
  error: String
  mapIterations: Int
  mapIterationDetails: [StepFunctionExecutionStep]
}

type StepFunctionExecutionResponse @aws_cognito_user_pools @aws_iam {
  executionArn: String!
  status: String!
  startDate: AWSDateTime
  stopDate: AWSDateTime
  input: AWSJSON
  output: AWSJSON
  error: String
  steps: [StepFunctionExecutionStep]
}

type DiscoveryJob  @aws_cognito_user_pools @aws_iam  {
  jobId: ID!
  status: String!
  errorMessage: String
}

type Agent @aws_cognito_user_pools @aws_iam {
  agent_id: String!
  agent_name: String!
  agent_description: String!
  sample_queries: [String]
}

type AgentJob @aws_cognito_user_pools @aws_iam {
  jobId: ID!
  status: String!  # "PENDING", "PROCESSING", "COMPLETED", "FAILED"
  query: String!
  agentIds: String  # JSON string containing list of agent IDs used
  createdAt: AWSDateTime!
  completedAt: AWSDateTime
  result: String
  error: String
  agent_messages: String  # JSON string containing agent conversation messages
}

type AgentJobConnection @aws_cognito_user_pools @aws_iam {
  items: [AgentJob]
  nextToken: String
}

type UserCompany @aws_cognito_user_pools @aws_iam {
  company_number: String!
  company_name: String!
  user_id: String!
  document_count: Int!
  first_registered: AWSTimestamp!
  last_activity: AWSTimestamp!
  document_types: [String]
}

type ExtractionResult @aws_cognito_user_pools @aws_iam {
  PK: ID!
  SK: ID!
  DocumentId: String!
  DocumentType: String!
  CompanyNumber: String
  CompanyName: String
  UserId: String!
  ExtractionStatus: String
  AnalysisStatus: String
  ProcessedAt: AWSTimestamp
  SectionId: String
  ConfidenceScore: Float
  # Invoice-specific fields
  InvoiceType: String
  InvoiceNumber: String
  InvoiceDate: String
  DueDate: String
  VendorName: String
  SupplierAddress: String
  TotalAmount: Float
  Currency: String
  # Bank Statement-specific fields
  BankName: String
  AccountNumber: String
  StatementDate: String
  StatementPeriod: String
  OpeningBalance: Float
  ClosingBalance: Float
  TransactionCount: Int
  TotalCredits: Float
  TotalDebits: Float
  # Bank Statement Transaction fields
  TransactionId: String
  TransactionDate: String
  TransactionDescription: String
  TransactionAmount: Float
  TransactionType: String
  AccountBalance: Float
  Reference: String
  SourcePage: String
  SortCode: String
  # Common metadata
  S3Uri: String
  ModelUsed: String
  ExtractedData: AWSJSON
  # Field-level confidence scores
  InvoiceTypeConfidence: Float
  SupplierNameConfidence: Float
  TotalAmountConfidence: Float
  InvoiceNumberConfidence: Float
  VATNumberConfidence: Float
  InvoiceDateConfidence: Float
  # Composite confidence and quality metrics
  CompositeConfidence: Float
  QualityTier: String
  # HITL (Human-In-The-Loop) flags
  HITLRequired: Boolean
  HITLReason: String
}

type ExtractionResultsConnection @aws_cognito_user_pools @aws_iam {
  items: [ExtractionResult]
  nextToken: String
}

type ValidationMismatch @aws_cognito_user_pools {
  documentId: String!
  userSelection: String!
  modelPrediction: String!
  confidence: Float!
  createdAt: Int!
  validationId: String!
  company: String
}

type ValidationByType @aws_cognito_user_pools {
  total: Int!
  matches: Int!
  mismatches: Int!
  highConfidenceMismatches: Int!
}

type ValidationByConfidence @aws_cognito_user_pools {
  total: Int!
  matches: Int!
}

type ValidationSummary @aws_cognito_user_pools {
  modelAccuracy: String!
  totalDocumentsValidated: Int!
  requiresAttention: Int!
}

type ValidationMetrics @aws_cognito_user_pools {
  timeRangeDays: Int!
  totalValidations: Int!
  matches: Int!
  mismatches: Int!
  matchRatePercent: Float!
  mismatchRatePercent: Float!
  byDocumentType: AWSJSON!
  byConfidenceBucket: AWSJSON!
  highConfidenceMismatches: [ValidationMismatch]
  summary: ValidationSummary!
}

type TransactionAnalysisResponse @aws_cognito_user_pools {
  success: Boolean!
  message: String!
  pending_count: Int
  batches_queued: Int
}

type Mutation  {
  createDocument(input: CreateDocumentInput!): CreateDocumentOutput @aws_iam
  updateDocument(input: UpdateDocumentInput!): Document @aws_iam
  deleteDocument(objectKeys: [String!]!): Boolean! @aws_cognito_user_pools
  updateConfiguration(customConfig: AWSJSON!): Boolean @aws_cognito_user_pools
  uploadDocument(fileName: String!, contentType: String, bucket: String, companyNumber: String, companyName: String, documentType: String): PresignedUrlResponse! @aws_cognito_user_pools
  uploadDiscoveryDocument(fileName: String!, contentType: String, prefix: String, bucket: String, groundTruthFileName: String): DisPresignedUrlResponse! @aws_cognito_user_pools
  copyToBaseline(objectKey: String!): CopyToBaselineResponse! @aws_cognito_user_pools
  reprocessDocument(objectKeys: [String!]!, documentType: String): Boolean! @aws_cognito_user_pools
  processChanges(objectKey: String!, modifiedSections: [ModifiedSectionInput!]!): ProcessChangesResponse! @aws_cognito_user_pools
  updateAgentJobStatus(jobId: ID!, status: String!, userId: String!, result: String): Boolean @aws_iam
  updateDiscoveryJobStatus(jobId: ID!, status: String!, errorMessage: String): DiscoveryJob @aws_iam
  deleteAgentJob(jobId: ID!): Boolean @aws_cognito_user_pools
  registerUserCompany(companyNumber: String!, companyName: String!): Boolean! @aws_cognito_user_pools
  deleteUserCompany(companyNumber: String!): Boolean! @aws_cognito_user_pools
  triggerTransactionAnalysis(companyNumber: String!): TransactionAnalysisResponse! @aws_cognito_user_pools
}

type Query @aws_cognito_user_pools @aws_iam {
  getDocument(ObjectKey: ID!): Document
  listDocuments(startDateTime: AWSDateTime, endDateTime: AWSDateTime, companyNumber: String): DocumentList
  listDocumentsDateHour(date: AWSDate, hour: Int, companyNumber: String): DocumentList
  listDocumentsDateShard(date: AWSDate, shard: Int, companyNumber: String): DocumentList 
  getFileContents(s3Uri: String!): FileContentsResponse
  getConfiguration: ConfigurationResponse
  listDiscoveryJobs: DiscoveryJobList
  queryKnowledgeBase(input: String!, sessionId: String): String
  chatWithDocument(s3Uri: String!, prompt: String!, history: AWSJSON!, modelId: String!): String
  getStepFunctionExecution(executionArn: String!): StepFunctionExecutionResponse
  listAvailableAgents: [Agent] @aws_cognito_user_pools @aws_iam
  submitAgentQuery(query: String!, agentIds: [String!]!): AgentJob @aws_cognito_user_pools
  getAgentJobStatus(jobId: ID!): AgentJob @aws_cognito_user_pools
  listAgentJobs(limit: Int, nextToken: String): AgentJobConnection @aws_cognito_user_pools
  getUserCompanies: [UserCompany] @aws_cognito_user_pools
  listExtractionResults(companyNumber: String!, documentType: String!, limit: Int, nextToken: String): ExtractionResultsConnection @aws_cognito_user_pools
  getValidationMetrics(timeRangeDays: Int, companyNumber: String, userId: String): ValidationMetrics @aws_cognito_user_pools
}

type Subscription @aws_cognito_user_pools @aws_iam {
  onCreateDocument: CreateDocumentOutput
	@aws_subscribe(mutations: ["createDocument"])
  onUpdateDocument: Document
    @aws_subscribe(mutations: ["updateDocument"])
  onAgentJobComplete(jobId: ID!): Boolean
    @aws_subscribe(mutations: ["updateAgentJobStatus"])
  onDiscoveryJobStatusChange(jobId: ID!): DiscoveryJob
    @aws_subscribe(mutations: ["updateDiscoveryJobStatus"])
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
