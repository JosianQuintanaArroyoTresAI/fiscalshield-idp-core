name: Deploy to Dev

# Automatically deploy to dev environment when dev branch is updated
on:
  push:
    branches: [dev]
  workflow_dispatch:  # Enable manual triggering from GitHub Actions UI

jobs:
  # Deploy Analysis Stack first (optional - continues on error)
  deploy-analysis:
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    steps:
      - name: Trigger Analysis Stack deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-analysis-dev.yml',
              ref: 'dev'
            });
      
      - name: Wait for Analysis Stack deployment
        run: |
          echo "⏳ Waiting 2 minutes for Analysis Stack to deploy..."
          sleep 120

  deploy-dev:
    runs-on: ubuntu-latest
    needs: deploy-analysis
    if: always()
    environment: dev  # 👈 Add this line to use the 'dev' environment secrets
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js for UI formatting check
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: src/ui/package-lock.json
    
    - name: Auto-format UI code with Prettier
      run: |
        echo "🎨 Auto-formatting code with Prettier..."
        cd src/ui
        npm ci --prefer-offline --no-audit
        npx prettier --write "src/**/*.{js,jsx,ts,tsx,json,css,scss}"
        echo "✅ Code formatted successfully"
    
    - name: Commit formatting changes if any
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if git diff --quiet; then
          echo "No formatting changes needed"
        else
          git add .
          git commit -m "chore: auto-format code with Prettier [skip ci]"
          git push
          echo "✅ Formatting changes committed and pushed"
          exit 0
        fi
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Set up AWS SAM CLI
      uses: aws-actions/setup-sam@v2
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        aws-region: eu-central-1
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        AWS_DEFAULT_REGION: eu-central-1
    
    - name: Install dependencies
      run: |
        pip install boto3 rich typer PyYAML botocore setuptools ruff black
    
    - name: Security audit and auto-fix UI dependencies
      run: |
        echo "🔍 Running security audit on UI dependencies..."
        cd src/ui
        
        # Try to auto-fix vulnerabilities
        echo "🔧 Attempting to auto-fix vulnerabilities..."
        if npm audit fix --audit-level=moderate; then
          echo "✅ Vulnerabilities fixed successfully"
        else
          echo "⚠️ Some vulnerabilities could not be auto-fixed"
          npm audit --audit-level=moderate --production || true
        fi
        
        # Check if package-lock.json was modified
        if git diff --quiet package-lock.json; then
          echo "✅ No changes needed to package-lock.json"
        else
          echo "📝 package-lock.json was updated with security fixes"
        fi
      continue-on-error: false
    
    - name: Commit security fixes if any
      run: |
        cd src/ui
        if ! git diff --quiet package-lock.json; then
          echo "💾 Committing security fixes..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: auto-fix npm security vulnerabilities [skip ci]"
          git push
          echo "✅ Security fixes committed and pushed"
        else
          echo "✅ No security fixes needed"
        fi
      continue-on-error: false
    
    - name: Force clean UI build (clear all caches)
      run: |
        echo "🧹 Clearing UI build caches to ensure fresh build..."
        cd src/ui
        rm -rf node_modules/.cache build .cache dist
        echo "✅ Caches cleared"
    
    - name: Build and publish
      run: |
        echo "🔨 Building and packaging Lambda functions, UI, and CloudFormation templates..."
        echo "🧹 Using clean build to ensure Pattern 2 Docker images are rebuilt..."
        python3 publish.py fiscalshield-dev idp eu-central-1 --clean-build --lint off
        
        if [ $? -ne 0 ]; then
          echo "❌ Build and publish failed!"
          exit 1
        fi
        
        echo "✅ Build completed successfully"
        echo "📦 Lambda packages uploaded to S3"
        echo "🌐 UI built and uploaded to S3"
        echo "📋 CloudFormation templates uploaded to S3"
      env:
        CI: true
        GENERATE_SOURCEMAP: false
    
    - name: Deploy to dev stack
      run: |
        echo "🚀 Deploying CloudFormation stack..."
        
        # Fetch Analysis Stack state machine ARNs from SSM (if they exist)
        TRANSACTION_ARN=$(aws ssm get-parameter \
          --name /fiscalshield/analysis/dev/transaction-categorization-state-machine-arn \
          --query 'Parameter.Value' --output text 2>/dev/null || echo "")
        
        INVOICE_ARN=$(aws ssm get-parameter \
          --name /fiscalshield/analysis/dev/invoice-analysis-state-machine-arn \
          --query 'Parameter.Value' --output text 2>/dev/null || echo "")
        
        echo "📋 Analysis Stack Integration:"
        if [ -n "$TRANSACTION_ARN" ]; then
          echo "  ✅ Transaction Analysis: ENABLED"
          echo "     ARN: $TRANSACTION_ARN"
        else
          echo "  ⏭️  Transaction Analysis: DISABLED (SSM parameter not found)"
        fi
        
        if [ -n "$INVOICE_ARN" ]; then
          echo "  ✅ Invoice Analysis: ENABLED"
          echo "     ARN: $INVOICE_ARN"
        else
          echo "  ⏭️  Invoice Analysis: DISABLED (SSM parameter not found)"
        fi
        
        # Build parameter overrides
        PARAMS="ParameterKey=AdminEmail,UsePreviousValue=true"
        PARAMS="$PARAMS ParameterKey=IDPPattern,UsePreviousValue=true"
        PARAMS="$PARAMS ParameterKey=Pattern2Configuration,ParameterValue=lending-package-sample"
        PARAMS="$PARAMS ParameterKey=DocumentKnowledgeBase,ParameterValue=DISABLED"
        
        if [ -n "$TRANSACTION_ARN" ]; then
          PARAMS="$PARAMS ParameterKey=TransactionCategorizationStateMachineArn,ParameterValue=$TRANSACTION_ARN"
        fi
        
        if [ -n "$INVOICE_ARN" ]; then
          PARAMS="$PARAMS ParameterKey=InvoiceAnalysisStateMachineArn,ParameterValue=$INVOICE_ARN"
        fi
        
        aws cloudformation update-stack \
          --stack-name fiscalshield-idp-dev \
          --template-url https://s3.eu-central-1.amazonaws.com/fiscalshield-dev-eu-central-1/idp/idp-main.yaml \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
          --region eu-central-1 \
          --parameters $PARAMS
        
        if [ $? -ne 0 ]; then
          echo "❌ CloudFormation update-stack command failed!"
          exit 1
        fi
        
        echo "✅ CloudFormation update initiated"
    
    - name: Wait for deployment to complete
      run: |
        echo "⏳ Waiting for CloudFormation stack to complete..."
        echo "This may take 15-20 minutes..."
        aws cloudformation wait stack-update-complete \
          --stack-name fiscalshield-idp-dev \
          --region eu-central-1
        
        if [ $? -eq 0 ]; then
          echo "✓ CloudFormation stack update completed successfully"
        else
          echo "✗ CloudFormation stack update failed or timed out"
          exit 1
        fi
    
    - name: Reload configuration to DynamoDB
      run: |
        echo "📋 Reloading configuration from S3 to DynamoDB..."
        
        # Get stack outputs (using correct output key names)
        CONFIG_BUCKET=$(aws cloudformation describe-stacks \
          --stack-name fiscalshield-idp-dev \
          --region eu-central-1 \
          --query 'Stacks[0].Outputs[?OutputKey==`S3ConfigurationBucketName`].OutputValue' \
          --output text 2>/dev/null || echo "")
        
        CONFIG_TABLE=$(aws cloudformation describe-stacks \
          --stack-name fiscalshield-idp-dev \
          --region eu-central-1 \
          --query 'Stacks[0].Outputs[?contains(OutputKey, `ConfigurationTable`)].OutputValue' \
          --output text 2>/dev/null | grep -o 'fiscalshield-idp-dev-ConfigurationTable-[A-Z0-9]*' | head -1 || echo "")
        
        if [ -z "$CONFIG_BUCKET" ] || [ -z "$CONFIG_TABLE" ]; then
          echo "❌ Could not retrieve required resources"
          echo "   CONFIG_BUCKET: $CONFIG_BUCKET"
          echo "   CONFIG_TABLE: $CONFIG_TABLE"
          exit 1
        fi
        
        echo "  Configuration Bucket: $CONFIG_BUCKET"
        echo "  Configuration Table: $CONFIG_TABLE"
        
        # Upload ALL pattern-2 configs to S3 (preserving directory structure)
        echo "📤 Uploading all pattern-2 configurations to S3..."
        aws s3 sync config_library/pattern-2/ "s3://$CONFIG_BUCKET/config_library/pattern-2/" \
          --region eu-central-1 \
          --exclude "*" \
          --include "*/config.yaml" \
          --delete
        
        if [ $? -ne 0 ]; then
          echo "❌ Failed to upload configurations to S3"
          exit 1
        fi
        
        echo "  ✅ All configurations uploaded to S3"
        
        # Load DEFAULT configuration to DynamoDB (fiscalshield-production)
        CONFIG_FILE="config_library/pattern-2/fiscalshield-production/config.yaml"
        
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "❌ Config file not found: $CONFIG_FILE"
          exit 1
        fi
        
        echo "📥 Loading fiscalshield-production as Default configuration..."
        python3 << EOF
        import boto3
        import yaml
        import sys
        from decimal import Decimal
        
        def convert_floats_to_decimal(obj):
            """Recursively convert float values to Decimal for DynamoDB compatibility"""
            if isinstance(obj, float):
                return Decimal(str(obj))
            elif isinstance(obj, dict):
                return {k: convert_floats_to_decimal(v) for k, v in obj.items()}
            elif isinstance(obj, list):
                return [convert_floats_to_decimal(item) for item in obj]
            return obj
        
        try:
            # Load config from file
            with open('$CONFIG_FILE', 'r') as f:
                config = yaml.safe_load(f)
            
            # Convert floats to Decimals for DynamoDB
            config = convert_floats_to_decimal(config)
            
            # Write to DynamoDB with correct schema (Configuration as partition key)
            dynamodb = boto3.resource('dynamodb', region_name='eu-central-1')
            table = dynamodb.Table('$CONFIG_TABLE')
            
            # Store as Default configuration (used by Lambdas)
            table.put_item(Item={
                'Configuration': 'Default',
                **config  # Spread all config keys
            })
            
            trust_hint = config.get('classification', {}).get('trust_user_hint', False)
            validate_hint = config.get('classification', {}).get('validate_hint_on_mismatch', False)
            
            print(f"  ✅ fiscalshield-production loaded as Default configuration!")
            print(f"  ✅ trust_user_hint: {trust_hint}")
            print(f"  ✅ validate_hint_on_mismatch: {validate_hint}")
            
        except Exception as e:
            print(f"❌ Failed to load configuration: {e}")
            import traceback
            traceback.print_exc()
            sys.exit(1)
        EOF
        
        if [ $? -ne 0 ]; then
          echo "❌ Configuration load failed"
          exit 1
        fi
        
        # Verify config was loaded
        ITEM_COUNT=$(aws dynamodb scan --table-name "$CONFIG_TABLE" --select COUNT --region eu-central-1 --query 'Count' --output text)
        echo "  📊 Configuration items in DynamoDB: $ITEM_COUNT"
        
        if [ "$ITEM_COUNT" -eq "0" ]; then
          echo "⚠️  WARNING: DynamoDB table is empty after reload!"
          exit 1
        fi
      env:
        AWS_DEFAULT_REGION: eu-central-1
    
    - name: Force update Lambda functions (bypass CloudFormation caching)
      run: |
        echo "🔄 Force updating non-Pattern2 Lambda functions with latest code..."
        echo "Note: Pattern 2 functions use Docker images and are updated via CloudFormation only"
        chmod +x scripts/force-update-lambdas.sh
        
        # Skip Pattern 2 functions - they use Docker images built by CodeBuild
        # Only update main stack ZIP-based functions
        ./scripts/force-update-lambdas.sh UploadResolver QueueSender QueueProcessor CreateDocument WorkflowTracker GetFileContents ListExtractionResults TriggerTransactionAnalysis || true
        
        echo "✅ Non-containerized Lambda functions updated"
        echo "ℹ️  Pattern 2 containerized functions updated by CloudFormation during stack update"
      env:
        STACK_NAME: fiscalshield-idp-dev
        REGION: eu-central-1
    
    - name: Verify UI deployment (force rebuild if needed)
      run: |
        echo "🔍 Verifying UI files were updated..."
        chmod +x scripts/force-rebuild-ui.sh
        # Check if UI was actually rebuilt by looking at S3 timestamps
        STACK_NAME=fiscalshield-idp-dev
        WEBUI_BUCKET=$(aws s3 ls | grep "${STACK_NAME}-webuibucket" | tail -1 | awk '{print $3}')
        if [ -n "$WEBUI_BUCKET" ]; then
          LATEST_FILE=$(aws s3 ls "s3://$WEBUI_BUCKET/static/js/" --recursive | grep "main\." | tail -1)
          FILE_DATE=$(echo "$LATEST_FILE" | awk '{print $1" "$2}')
          CURRENT_DATE=$(date -u +"%Y-%m-%d %H:%M")
          echo "Latest UI file timestamp: $FILE_DATE"
          echo "Current time: $CURRENT_DATE"
          # If file is more than 5 minutes old, something might be wrong
          if [ -n "$FILE_DATE" ]; then
            echo "✅ UI files found in S3"
          else
            echo "⚠️ Could not verify UI file timestamps, but continuing..."
          fi
        fi
      continue-on-error: true
      env:
        REGION: eu-central-1
    
    - name: Invalidate CloudFront cache
      run: |
        echo "🌐 Invalidating CloudFront cache to serve latest UI..."
        
        STACK_NAME=fiscalshield-idp-dev
        REGION=eu-central-1
        
        # Get CloudFront distribution ID
        DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$REGION" \
          --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
          --output text 2>/dev/null || echo "")
        
        if [ -z "$DISTRIBUTION_ID" ]; then
          # Try to find by resource
          DISTRIBUTION_ID=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'StackResources[?ResourceType==`AWS::CloudFront::Distribution`].PhysicalResourceId' \
            --output text 2>/dev/null || echo "")
        fi
        
        if [ -z "$DISTRIBUTION_ID" ]; then
          echo "⚠️  Could not find CloudFront distribution - skipping invalidation"
          echo "    You may need to hard refresh your browser (Ctrl+Shift+R)"
          exit 0
        fi
        
        echo "✅ Found CloudFront distribution: $DISTRIBUTION_ID"
        
        # Create invalidation
        INVALIDATION_ID=$(aws cloudfront create-invalidation \
          --distribution-id "$DISTRIBUTION_ID" \
          --paths "/*" \
          --query 'Invalidation.Id' \
          --output text)
        
        echo "✅ CloudFront invalidation created: $INVALIDATION_ID"
        echo "⏳ Cache will be cleared in 1-2 minutes"
        echo ""
        echo "📋 After deployment:"
        echo "  1. Wait 2 minutes for CloudFront invalidation"
        echo "  2. Hard refresh your browser (Ctrl+Shift+R or Cmd+Shift+R)"
        echo "  3. Changes should be visible"
      continue-on-error: true
    
    - name: Run smoke tests
      id: smoke-tests
      run: |
        echo "🔍 Running post-deployment smoke tests..."
        chmod +x scripts/smoke-test.sh
        if ./scripts/smoke-test.sh; then
          echo "smoke_test_status=✅ PASSED" >> $GITHUB_OUTPUT
        else
          echo "smoke_test_status=⚠️ FAILED" >> $GITHUB_OUTPUT
        fi
      continue-on-error: true
      env:
        STACK_NAME: fiscalshield-idp-dev
        REGION: eu-central-1
    
    - name: Deployment summary
      run: |
        echo "✅ Dev deployment complete!"
        echo "Stack URL: https://eu-central-1.console.aws.amazon.com/cloudformation/home?region=eu-central-1#/stacks/stackinfo?stackId=fiscalshield-idp-dev"
    
    - name: Send deployment notification
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const smokeTestStatus = '${{ steps.smoke-tests.outputs.smoke_test_status }}' || '⏭️ SKIPPED';
          const emoji = status === 'success' ? '✅' : '❌';
          const color = status === 'success' ? '28a745' : 'dc3545';
          
          const body = `${emoji} **Dev Deployment ${status.toUpperCase()}**
          
          **Branch:** \`${context.ref}\`
          **Commit:** \`${context.sha.substring(0, 7)}\`
          **Author:** @${context.actor}
          **Workflow:** [${context.workflow}](${context.payload.repository.html_url}/actions/runs/${context.runId})
          
          **Smoke Tests:** ${smokeTestStatus}
          
          ${status === 'success' ? '🎉 Changes are now live in dev environment!\n\n**Next Steps:**\n- [ ] Verify smoke test results above\n- [ ] Test your specific changes manually\n- [ ] Check CloudWatch logs if needed' : '⚠️ Deployment failed. Check logs for details.'}
          
          **Stack URL:** https://eu-central-1.console.aws.amazon.com/cloudformation/home?region=eu-central-1#/stacks/stackinfo?stackId=fiscalshield-idp-dev
          `;
          
          // Create a comment on the commit
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: body
          });
