name: Deploy to Production

# Manual deployment to production (requires approval)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        default: 'CANCEL'

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production  # Requires environment approval in GitHub settings
    
    steps:
    - name: Verify confirmation
      run: |
        if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
          echo "❌ Deployment cancelled - confirmation not provided"
          exit 1
        fi
    
    - name: Checkout code (main branch only)
      uses: actions/checkout@v4
      with:
        ref: main
    
    - name: Set up Node.js for UI formatting check
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: src/ui/package-lock.json
    
    - name: Check UI code formatting with Prettier
      run: |
        echo "🎨 Checking code formatting with Prettier..."
        cd src/ui
        npm ci --prefer-offline --no-audit
        npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,scss}" || {
          echo "❌ Code formatting issues detected!"
          echo "💡 Run 'cd src/ui && npx prettier --write \"src/**/*.{js,jsx}\"' to fix"
          exit 1
        }
        echo "✅ All code is properly formatted"
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Set up AWS SAM CLI
      uses: aws-actions/setup-sam@v2
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: eu-central-1
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        AWS_DEFAULT_REGION: eu-central-1
    
    - name: Install dependencies
      run: |
        pip install boto3 rich typer PyYAML botocore setuptools ruff black
    
    - name: Run tests before deployment
      run: |
        pip install pytest pytest-cov moto pyarrow
        pip install -e lib/idp_common_pkg/[test]
        pytest lib/idp_common_pkg/tests/ -v \
          --ignore=lib/idp_common_pkg/tests/unit/test_publish.py \
          --ignore=lib/idp_common_pkg/tests/test_assessment_backward_compatibility.py \
          --ignore=lib/idp_common_pkg/tests/unit/test_document_compression.py \
          --ignore=lib/idp_common_pkg/tests/unit/test_granular_assessment.py \
          --ignore=lib/idp_common_pkg/tests/unit/assessment/test_assessment_enabled_property.py \
          --ignore=lib/idp_common_pkg/tests/unit/assessment/test_bounding_box_integration.py
    
    - name: Build and publish
      run: |
        python3 publish.py fiscalshield-prod idp eu-central-1 --lint off
    
    - name: Check if stack exists
      id: check_stack
      run: |
        if aws cloudformation describe-stacks --stack-name fiscalshield-idp-prod --region eu-central-1 >/dev/null 2>&1; then
          echo "stack_exists=true" >> $GITHUB_OUTPUT
          echo "✓ Stack exists - will update"
        else
          echo "stack_exists=false" >> $GITHUB_OUTPUT
          echo "✓ Stack does not exist - will create"
        fi
    
    - name: Deploy to production stack
      run: |
        TEMPLATE_URL="https://s3.eu-central-1.amazonaws.com/fiscalshield-prod-eu-central-1/idp/idp-main.yaml"
        
        if [ "${{ steps.check_stack.outputs.stack_exists }}" == "true" ]; then
          echo "🔄 Updating existing stack..."
          aws cloudformation update-stack \
            --stack-name fiscalshield-idp-prod \
            --template-url "$TEMPLATE_URL" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --region eu-central-1 \
            --parameters ParameterKey=AdminEmail,UsePreviousValue=true \
                         ParameterKey=IDPPattern,UsePreviousValue=true \
                         ParameterKey=Pattern2Configuration,UsePreviousValue=true \
                         ParameterKey=DocumentKnowledgeBase,UsePreviousValue=true \
                         ParameterKey=AllowedSignUpEmailDomain,ParameterValue="gmail.com,outlook.com,yahoo.com,hotmail.com,icloud.com,protonmail.com,duck.com"
        else
          echo "🆕 Creating new stack..."
          # For new stack, use the same parameters as your samconfig.toml
          aws cloudformation create-stack \
            --stack-name fiscalshield-idp-prod \
            --template-url "$TEMPLATE_URL" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --region eu-central-1 \
            --parameters \
              ParameterKey=AdminEmail,ParameterValue="josian@protonmail.com" \
              ParameterKey=IDPPattern,ParameterValue="Pattern2 - Packet processing with Textract and Bedrock" \
              ParameterKey=Pattern1Configuration,ParameterValue=lending-package-sample \
              ParameterKey=Pattern2Configuration,ParameterValue=rvl-cdip-package-sample \
              ParameterKey=Pattern3Configuration,ParameterValue=rvl-cdip-package-sample \
              ParameterKey=DocumentKnowledgeBase,ParameterValue=DISABLED \
              ParameterKey=AllowedSignUpEmailDomain,ParameterValue="gmail.com,outlook.com,yahoo.com,hotmail.com,icloud.com,protonmail.com,duck.com,tresai.ai" \
              ParameterKey=EnableHITL,ParameterValue=true \
              ParameterKey=LogLevel,ParameterValue=INFO \
              ParameterKey=LogRetentionDays,ParameterValue=30 \
              ParameterKey=DataRetentionInDays,ParameterValue=30 \
              ParameterKey=MaxConcurrentWorkflows,ParameterValue=10
        fi
    
    - name: Wait for deployment to complete
      run: |
        echo "⏳ Waiting for CloudFormation stack to complete..."
        echo "This may take 15-20 minutes..."
        
        if [ "${{ steps.check_stack.outputs.stack_exists }}" == "true" ]; then
          aws cloudformation wait stack-update-complete \
            --stack-name fiscalshield-idp-prod \
            --region eu-central-1
        else
          aws cloudformation wait stack-create-complete \
            --stack-name fiscalshield-idp-prod \
            --region eu-central-1
        fi
        
        if [ $? -eq 0 ]; then
          echo "✓ CloudFormation stack deployment completed successfully"
        else
          echo "✗ CloudFormation stack deployment failed or timed out"
          exit 1
        fi
    
    - name: Reload configuration to DynamoDB
      run: |
        echo "📋 Reloading configuration from S3..."
        
        # Get stack outputs
        CONFIG_BUCKET=$(aws cloudformation describe-stacks \
          --stack-name fiscalshield-idp-prod \
          --region eu-central-1 \
          --query 'Stacks[0].Outputs[?OutputKey==`ConfigurationBucket`].OutputValue' \
          --output text 2>/dev/null || echo "")
        
        UPDATE_FUNCTION=$(aws cloudformation describe-stacks \
          --stack-name fiscalshield-idp-prod \
          --region eu-central-1 \
          --query 'Stacks[0].Outputs[?OutputKey==`UpdateConfigurationFunctionName`].OutputValue' \
          --output text 2>/dev/null || echo "")
        
        if [ -n "$CONFIG_BUCKET" ] && [ -n "$UPDATE_FUNCTION" ]; then
          echo "  Configuration Bucket: $CONFIG_BUCKET"
          echo "  Update Function: $UPDATE_FUNCTION"
          
          # Upload config to S3
          CONFIG_FILE="config_library/pattern-2/lending-package-sample/config.yaml"
          S3_KEY="pattern-2/lending-package-sample/config.yaml"
          
          if [ -f "$CONFIG_FILE" ]; then
            echo "Uploading configuration to S3..."
            aws s3 cp "$CONFIG_FILE" "s3://$CONFIG_BUCKET/$S3_KEY" --region eu-central-1
            echo "  ✅ Uploaded to s3://$CONFIG_BUCKET/$S3_KEY"
            
            # Trigger configuration reload
            echo "Triggering configuration reload..."
            aws lambda invoke \
              --function-name "$UPDATE_FUNCTION" \
              --region eu-central-1 \
              --payload "{\"s3_uri\": \"s3://$CONFIG_BUCKET/$S3_KEY\"}" \
              /tmp/config-reload-response.json > /dev/null 2>&1
            
            if [ $? -eq 0 ]; then
              echo "  ✅ Configuration reloaded successfully!"
              echo ""
              echo "Key Settings Active:"
              echo "  ✅ trust_user_hint: true (Skip LLM classification when user selects type)"
              echo "  ✅ USE_SEMANTIC_CHUNKING: true (Invoice boundary detection enabled)"
            else
              echo "  ⚠️ Configuration reload had issues (non-critical)"
            fi
          else
            echo "  ⚠️ Config file not found: $CONFIG_FILE"
          fi
        else
          echo "  ⚠️ Could not retrieve stack outputs"
        fi
      continue-on-error: true
      env:
        AWS_DEFAULT_REGION: eu-central-1
    
    - name: Force update Lambda functions (bypass CloudFormation caching)
      continue-on-error: true
      run: |
        echo "🔄 Force updating Lambda functions with latest code..."
        chmod +x scripts/force-update-lambdas.sh
        ./scripts/force-update-lambdas.sh || echo "⚠️ Some functions failed to update, but deployment continues"
      env:
        STACK_NAME: fiscalshield-idp-prod
        REGION: eu-central-1
    
    - name: Run smoke tests
      run: |
        echo "🔍 Running post-deployment smoke tests..."
        chmod +x scripts/smoke-test.sh
        ./scripts/smoke-test.sh || echo "⚠️  Some smoke tests failed but deployment continues"
      continue-on-error: true
      env:
        STACK_NAME: fiscalshield-idp-prod
        REGION: eu-central-1
    
    - name: Deployment summary
      run: |
        echo ""
        echo "✅ PRODUCTION deployment complete!"
        echo ""
        echo "Deployment Summary:"
        echo "  ✓ Artifacts built and published to S3"
        echo "  ✓ CloudFormation stack deployed/updated"
        echo "  ✓ Lambda functions force-updated with latest code"
        echo ""
        echo "Stack URL: https://eu-central-1.console.aws.amazon.com/cloudformation/home?region=eu-central-1#/stacks/stackinfo?stackId=fiscalshield-idp-prod"
        echo ""
        echo "⚠️  IMPORTANT: Remember to verify Cognito groups are configured!"
        echo ""
        echo "Next Steps:"
        echo "  1. Verify Cognito Admin and Users groups exist"
        echo "  2. Assign admin users to Admin group"
        echo "  3. Test admin and regular user access"
        echo "  4. Monitor Lambda logs for errors"
    
    - name: Send deployment notification
      if: always()
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const emoji = status === 'success' ? '🚀' : '❌';
          
          const body = `${emoji} **PRODUCTION Deployment ${status.toUpperCase()}**
          
          **Branch:** \`main\`
          **Commit:** \`${context.sha.substring(0, 7)}\`
          **Author:** @${context.actor}
          **Workflow:** [${context.workflow}](${context.payload.repository.html_url}/actions/runs/${context.runId})
          
          ${status === 'success' ? '✅ Production deployment completed successfully!\n\n⚠️ **Action Required:**\n1. Verify Cognito groups\n2. Test critical user flows\n3. Monitor logs for 15 minutes' : '❌ **PRODUCTION DEPLOYMENT FAILED**\n\nImmediate action required! Check logs and consider rollback.'}
          `;
          
          try {
            // Try to create a comment on the commit
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
          } catch (error) {
            console.log('Could not create notification (Issues may be disabled):', error.message);
          }
